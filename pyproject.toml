[project]
name = "livekit-durable-handoff"
version = "0.1.0"
description = "Reference example: durable, long-running agent work with handoff across voice and text, on LiveKit Agents + Temporal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Joshua Jordan" }]
dependencies = [
    "livekit-agents>=1.8.11,<1.9",
    "temporalio>=1.36,<2",
    "pydantic>=2.7",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Only for the live demo / voice mode. Tests never need these.
live = ["livekit-plugins-openai>=1.8.11,<1.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_handoff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs the Temporal dev server (downloaded once, then cached)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC109", "ASYNC110"]  # test polling helpers take explicit timeouts

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
